services:
  postgres:
    image: postgres:16
    container_name: ms_plazoleta_db
    environment:
      POSTGRES_DB: ms_plazoleta_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - ms_plazoleta_data:/var/lib/postgresql/data

volumes:
  ms_plazoleta_data:
